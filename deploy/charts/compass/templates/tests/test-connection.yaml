apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "compass.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compass.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "compass.fullname" . }}:{{ .Values.service.port }}']
