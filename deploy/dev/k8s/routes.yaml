# Two HTTPRoutes with compass.adinhodovic.com/* annotations so the
# kubernetes source's annotation-overrides code path also fires (name,
# description, icon, tags). The hostnames are the disambiguator the
# source uses to derive a service URL — see endpointIDSuffix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  annotations:
    compass.adinhodovic.com/name: "Argo CD"
    compass.adinhodovic.com/description: "GitOps continuous delivery for Kubernetes."
    compass.adinhodovic.com/icon: "simple-icons:argo"
    compass.adinhodovic.com/tags: "kubernetes,gitops,gateway-api"
spec:
  parentRefs:
    - name: dev-gateway
  hostnames:
    - argocd.k8s.dev.local
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  annotations:
    compass.adinhodovic.com/name: "Prometheus"
    compass.adinhodovic.com/description: "Cluster-scoped metrics + PromQL."
    compass.adinhodovic.com/icon: "simple-icons:prometheus"
    compass.adinhodovic.com/tags: "kubernetes,monitoring,gateway-api"
spec:
  parentRefs:
    - name: dev-gateway
  hostnames:
    - prometheus.k8s.dev.local
  rules:
    - backendRefs:
        - name: prometheus-server
          port: 9090
