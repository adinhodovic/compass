# Dev stack for exercising every Compass source end-to-end.
#
#   docker compose -f deploy/dev/docker-compose.yml up -d
#   HEADSCALE_API_KEY=$(cat deploy/dev/.headscale-key/apikey.txt) \
#   NETBIRD_API_TOKEN=$(cat deploy/dev/.netbird-key/token.txt) \
#     go run ./cmd/compass -c deploy/dev/compass.yaml
#
# Compass runs on the host so it can read /var/run/docker.sock and
# reach Caddy's admin API on localhost:2019.

services:
  # Exercises the api source: Compass reads Caddy's admin API and
  # turns each route into a service.
  caddy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    restart: unless-stopped
    ports:
      - "2019:2019" # admin API (consumed by Compass's api source)
      - "8081:80"   # serves a tiny site so the URL works
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      compass.adinhodovic.com/name: "Caddy"
      compass.adinhodovic.com/urls: "http://localhost:8081"
      compass.adinhodovic.com/tags: "proxy,web"
      compass.adinhodovic.com/icon: "simple-icons:caddy"
      compass.adinhodovic.com/links: "lucide:heart-pulse|Admin API=http://localhost:2019/config/,lucide:book-open|Runbook=/pages/on-call/runbook"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2019/config/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Exercises the docker source's Traefik-rule fallback (see whoami).
  # No healthcheck: the official image is scratch-based and the
  # `traefik healthcheck` subcommand needs the static-config flags
  # replayed for the ping endpoint to resolve, which is more compose
  # plumbing than this is worth. Traefik comes up fast; if Compass
  # refreshes before it's ready, the next tick picks it up.
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "8082:80"   # routed traffic
      - "8083:8080" # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      compass.adinhodovic.com/name: "Traefik"
      compass.adinhodovic.com/urls: "http://localhost:8083"
      compass.adinhodovic.com/tags: "proxy"
      compass.adinhodovic.com/icon: "simple-icons:traefikproxy"

  # No compass.adinhodovic.com/urls label — the docker source must derive
  # http://whoami.localhost from the traefik.http.routers.whoami.rule label.
  whoami:
    image: traefik/whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "compass.adinhodovic.com/name=Whoami"
      - "compass.adinhodovic.com/tags=demo"

  # Verifies com.docker.compose.project auto-tagging and the
  # com.docker.compose.service name fallback in the docker source.
  echo:
    image: hashicorp/http-echo
    restart: unless-stopped
    command: -text="hello from echo"
    ports:
      - "8084:5678"
    labels:
      compass.adinhodovic.com/urls: "http://localhost:8084"
      compass.adinhodovic.com/tags: "demo"
      compass.adinhodovic.com/icon: "/assets/http-echo.svg"

  # Provides the embedded Grafana panels referenced from
  # compass.yaml's static source.
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      compass.adinhodovic.com/name: "Grafana"
      compass.adinhodovic.com/urls: "http://localhost:3000"
      compass.adinhodovic.com/tags: "monitoring,observability"
      compass.adinhodovic.com/icon: "selfhst:grafana"
      compass.adinhodovic.com/links: "lucide:heart-pulse|Health=http://localhost:3000/api/health,lucide:braces|Dashboard JSON=http://localhost:3000/api/dashboards/uid/golden-signals,lucide:book-open|Runbook=/pages/on-call/runbook"
      compass.adinhodovic.com/grafana-panels: "Golden Signals Traffic=http://localhost:3000/d-solo/golden-signals/the-four-golden-signals?orgId=1&from=now-6h&to=now&timezone=browser&panelId=2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Exercises the api source's items_mode: values for map-of-objects
  # responses. Services are auto-registered from consul-services.json
  # on startup.
  consul:
    image: hashicorp/consul:1.20
    restart: unless-stopped
    command: agent -dev -client=0.0.0.0 -log-level=warn -config-dir=/consul/config
    ports:
      - "8500:8500" # HTTP API consumed by Compass
    volumes:
      - ./consul-services.json:/consul/config/services.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8500/v1/status/leader >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Exercises the dns_sd source. Compass runs on the host and queries this
  # CoreDNS instance directly via dns_sd.nameservers: [127.0.0.1:1053].
  coredns:
    image: coredns/coredns:1.12.4
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - ./coredns/home.arpa.zone:/zones/home.arpa.zone:ro

  # Self-hosted Tailscale coordination server. The named volume
  # persists state across dev-up cycles; headscale-init idempotently
  # bootstraps a user, two demo nodes, and an API key.
  headscale:
    image: headscale/headscale:0.28.0
    command: serve
    restart: unless-stopped
    ports:
      - "8085:8080"  # HTTP API (legacy api-source recipe still works)
      - "50443:50443" # gRPC API consumed by the headscale source
      - "9091:9090"  # Prometheus metrics
    volumes:
      - ./headscale-config.yaml:/etc/headscale/config.yaml:ro
      - headscale-socket:/var/run/headscale
      - headscale-data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "users", "list"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  # One-shot bootstrap. Builds a tiny alpine+headscale+jq image
  # (Dockerfile.headscale-init) because the upstream headscale image is
  # distroless. Sleeps after bootstrapping so `compose up --wait` sees
  # it running. The API key is written into deploy/dev/.headscale-key so
  # `make dev` can export it for Compass.
  headscale-init:
    build:
      context: .
      dockerfile: Dockerfile.headscale-init
    image: compass-dev-headscale-init:local
    depends_on:
      headscale:
        condition: service_healthy
    volumes:
      - ./headscale-config.yaml:/etc/headscale/config.yaml:ro
      - headscale-socket:/var/run/headscale
      # Bind-mount onto the host so make/dev shell commands can export
      # HEADSCALE_API_KEY for Compass.
      - ./.headscale-key:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KEY_FILE=/state/apikey.txt
        # `users create dev` succeeds only when the user doesn't exist —
        # i.e. when headscale-data is a fresh volume. That's the signal
        # to discard a cached API key from a previous compose generation;
        # the new DB won't recognize it.
        if headscale users create dev >/dev/null 2>&1; then
          rm -f "$$KEY_FILE"
        fi
        # 0.28's two-step registration:
        #   1. debug create-node creates a pending registration (24-char key)
        #   2. nodes register finalizes it; only then does /api/v1/node list it
        # Skip if a node with the same name already exists — debug
        # create-node would otherwise auto-suffix on name conflict.
        existing=$$(headscale nodes list -o json 2>/dev/null || echo '[]')
        for entry in demo-laptop:aaaaaaaaaaaaaaaaaaaaaaaa demo-server:bbbbbbbbbbbbbbbbbbbbbbbb; do
          name=$${entry%:*}
          key=$${entry#*:}
          echo "$$existing" | jq -e --arg name "$$name" 'any(.[]; .name == $$name or .given_name == $$name)' >/dev/null && continue
          headscale debug create-node --name $$name --user dev --key $$key >/dev/null 2>&1 || true
          headscale nodes register --user dev --key $$key >/dev/null 2>&1 || true
          existing=$$(headscale nodes list -o json 2>/dev/null || echo '[]')
        done
        # Reuse the key when the headscale DB volume survived; otherwise
        # mint a fresh one and stash it.
        if [ -s "$$KEY_FILE" ]; then
          cat "$$KEY_FILE"
        else
          KEY=$$(headscale apikeys create --expiration 720h)
          echo "$$KEY" > "$$KEY_FILE"
          echo "$$KEY"
        fi
        exec sleep infinity

  # Self-hosted NetBird combined server. NB_SETUP_PAT_ENABLED lets
  # netbird-init create the owner and get a PAT back in one unauthenticated
  # /api/setup call, the same path NetBird's own e2e harness uses.
  netbird:
    image: netbirdio/netbird-server:0.81.3
    command: ["--config", "/etc/netbird/config.yaml"]
    restart: unless-stopped
    environment:
      NB_SETUP_PAT_ENABLED: "true"
      NB_DISABLE_GEOLOCATION: "true"
    ports:
      - "8086:8080" # REST API consumed by the netbird source
    volumes:
      - ./netbird-config.yaml:/etc/netbird/config.yaml:ro
      - netbird-data:/var/lib/netbird
    healthcheck:
      # The image is plain ubuntu (no curl/wget); bash's /dev/tcp is enough
      # to see the healthcheck listener come up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  # One-shot bootstrap: owner + PAT, a `servers` group, and a reusable
  # setup key that auto-assigns it. Writes the PAT and setup key into
  # deploy/dev/.netbird-key so `make dev` can export NETBIRD_API_TOKEN and
  # the demo peers can join. Sleeps afterwards so `compose up --wait` sees
  # it running; the healthcheck gates the peers on the setup key existing.
  netbird-init:
    build:
      context: .
      dockerfile: Dockerfile.netbird-init
    image: compass-dev-netbird-init:local
    depends_on:
      netbird:
        condition: service_healthy
    volumes:
      - ./.netbird-key:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        API=http://netbird:8080/api
        TOKEN_FILE=/state/token.txt
        SETUP_KEY_FILE=/state/setupkey.txt
        until curl -fsS "$$API/instance" >/tmp/instance.json; do sleep 1; done
        # setup_required is true only on a fresh netbird-data volume, so a
        # cached PAT / setup key from a previous generation is stale.
        if jq -e '.setup_required' /tmp/instance.json >/dev/null; then
          rm -f "$$TOKEN_FILE" "$$SETUP_KEY_FILE"
          curl -fsS -X POST "$$API/setup" -H 'Content-Type: application/json' \
            -d '{"email":"dev@compass.local","password":"compass-dev-password","name":"Compass Dev","create_pat":true,"pat_expire_in":365}' \
            | jq -r '.personal_access_token' > "$$TOKEN_FILE"
        fi
        if [ ! -s "$$TOKEN_FILE" ]; then
          echo "netbird is set up but $$TOKEN_FILE is missing; reset with: docker compose -f deploy/dev/docker-compose.yml down -v" >&2
          exit 1
        fi
        AUTH="Authorization: Token $$(cat "$$TOKEN_FILE")"
        if [ ! -s "$$SETUP_KEY_FILE" ]; then
          GROUP_ID=$$(curl -fsS -X POST "$$API/groups" -H "$$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"servers"}' | jq -r '.id')
          curl -fsS -X POST "$$API/setup-keys" -H "$$AUTH" -H 'Content-Type: application/json' \
            -d "{\"name\":\"compass-dev\",\"type\":\"reusable\",\"expires_in\":31536000,\"auto_groups\":[\"$$GROUP_ID\"],\"usage_limit\":0}" \
            | jq -r '.key' > "$$SETUP_KEY_FILE"
        fi
        # Compass runs on the host as the invoking user and must read the PAT.
        chmod 644 "$$TOKEN_FILE" "$$SETUP_KEY_FILE"
        echo "netbird bootstrap complete"
        exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-s", "/state/setupkey.txt"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Two demo peers so the netbird source has something to list. Netstack
  # mode runs WireGuard in userspace without a TUN device, so no extra
  # capabilities are needed.
  netbird-peer-laptop: &netbird-peer
    image: netbirdio/netbird:0.81.3
    restart: unless-stopped
    depends_on:
      netbird-init:
        condition: service_healthy
    environment:
      NB_MANAGEMENT_URL: http://netbird:8080
      NB_HOSTNAME: demo-laptop
      NB_USE_NETSTACK_MODE: "true"
    volumes:
      - ./.netbird-key:/state:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - NB_SETUP_KEY="$$(cat /state/setupkey.txt)" exec /usr/local/bin/netbird-entrypoint.sh

  netbird-peer-server:
    <<: *netbird-peer
    environment:
      NB_MANAGEMENT_URL: http://netbird:8080
      NB_HOSTNAME: demo-server
      NB_USE_NETSTACK_MODE: "true"

  # Local k3s cluster for the kubernetes source's inline-credentials code
  # path (cluster_url + bearer_token_file + cluster_ca_file). The
  # kubeconfig source already in compass.yaml exercises the kubeconfig
  # code path against whatever ~/.kube/config points at; this one fills
  # the dark spot. traefik/servicelb/metrics-server are disabled — the
  # demo manifests only need the apiserver to accept Gateway / HTTPRoute
  # objects, no controller has to reconcile them.
  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --disable=metrics-server
      - --tls-san=127.0.0.1
      - --write-kubeconfig-mode=644
    privileged: true
    restart: unless-stopped
    ports:
      # 16443 (microk8s convention) — leaves 6443 free for any kind /
      # minikube the contributor already has running locally.
      - "16443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      # k3s auto-applies any YAML at the top of its manifests dir on
      # boot (with retries until CRDs/dependencies exist). Mounts are
      # per-file because a dir mount would shadow k3s's own bundled
      # manifests (CoreDNS, etc.). Numeric prefix gives a stable lexical
      # apply order; k3s retries so strict ordering isn't required.
      - ./k8s/crds/gateway-api.yaml:/var/lib/rancher/k3s/server/manifests/00-gateway-api.yaml:ro
      - ./k8s/rbac.yaml:/var/lib/rancher/k3s/server/manifests/10-rbac.yaml:ro
      - ./k8s/gateway.yaml:/var/lib/rancher/k3s/server/manifests/20-gateway.yaml:ro
      - ./k8s/routes.yaml:/var/lib/rancher/k3s/server/manifests/30-routes.yaml:ro
    tmpfs:
      - /run
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "kubectl get --raw=/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # One-shot bootstrap: waits for the auto-deployed compass-reader SA
  # to exist, then mints a long-lived token + extracts the cluster CA
  # into deploy/dev/.kube/ for compass.yaml's inline source. Reuses the
  # rancher/k3s image since it already ships kubectl.
  #
  # `network_mode: service:k3s` shares the k3s container's network
  # namespace so admin.kubeconfig's `https://127.0.0.1:6444` URL
  # resolves correctly (it's k3s's supervisor port, only reachable on
  # k3s's own loopback) and the apiserver TLS cert (which only SANs
  # 127.0.0.1) validates without us needing to extend it.
  k3s-init:
    image: rancher/k3s:v1.31.4-k3s1
    depends_on:
      k3s:
        condition: service_healthy
    network_mode: "service:k3s"
    volumes:
      - k3s-data:/var/lib/rancher/k3s:ro
      - ./.kube:/state
    entrypoint: ["/bin/sh", "-c"]
    environment:
      KUBECONFIG: /var/lib/rancher/k3s/server/cred/admin.kubeconfig
    command:
      - |
        set -e
        # k3s applies our manifests via auto-deploy; the SA can lag
        # /readyz by a tick, so wait for it before minting a token.
        until kubectl get sa compass-reader >/dev/null 2>&1; do sleep 1; done
        # 1y TTL — local dev stack, refresh with `make dev-up` if it
        # ever actually expires.
        kubectl create token compass-reader --duration=8760h > /state/token
        # admin.kubeconfig uses a path-reference for the CA, not inline
        # data, so copy the source PEM directly.
        cp /var/lib/rancher/k3s/server/tls/server-ca.crt /state/ca.crt
        # Compass runs on the host (not root inside the container) and
        # needs to read both files. Force 644 explicitly because `>`
        # preserves a pre-existing mode if the file is being overwritten
        # from a prior run.
        chmod 644 /state/token /state/ca.crt
        exec sleep infinity

volumes:
  headscale-socket:
  headscale-data:
  netbird-data:
  k3s-data:
