organization:
  name: Compass E2E
  description: Browser test for Compass
  logo: lucide:test-tube

ui:
  default_group_by: tags

# Grafana up, Wiki down, Prometheus unmatched (no status).
status:
  - type: json
    name: e2e
    url: http://127.0.0.1:18081/
    interval: 1s
    service: host
    up: up

services:
  sources:
    - type: static
      name: manual
      services:
        - name: Grafana
          url: https://grafana.example.test
          tags: [monitoring, core]
          description: Dashboards and observability context.
          icon: lucide:bar-chart-3
        - name: Prometheus
          url: https://prometheus.example.test
          tags: [monitoring]
          description: Metrics and PromQL.
          icon: lucide:activity
        - name: Wiki
          url: https://wiki.example.test
          tags: [docs]
          description: Internal documentation.
          icon: lucide:book-open
