---
version: "2"

linters:
  default: standard
  # `default: standard` enables: errcheck, govet, ineffassign, staticcheck, unused.
  enable:
    - errorlint
    - errname
    - misspell
  exclusions:
    paths:
      - tmp/
      - internal/server/static/
      - site/
      - node_modules/

formatters:
  enable:
    - goimports
    - golines
    - gofumpt
  settings:
    golines:
      max-len: 100
