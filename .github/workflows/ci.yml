name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!deploy/**"
      - "!docs/**"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!deploy/**"
      - "!docs/**"
      - "!**/*.md"
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false
          inputs: .github/workflows
          version: 1.24.1

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # internal/server/static/ is gitignored and regenerated by
      # `make build`; the //go:embed in server.go fails typecheck
      # otherwise, so populate it before lint.
      - name: Build assets
        run: make assets

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2

      - name: Build binary
        run: make build

      - name: Run unit tests
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.0
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.x --bin-dir /tmp/envtest -p path)"
          go test ./... -v

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: make test-e2e

      - name: Run govulncheck
        # JSON mode exits 0 regardless; the jq step is the actual gate.
        # Two Moby IDs are allowlisted: both are server-side vulns
        # (AuthZ plugin bypass, plugin-privilege off-by-one) that
        # Compass never reaches — we use the docker client only to
        # list containers. No upstream fix is published yet.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          govulncheck -format json ./... > vuln.json
          findings=$(jq -r 'select(.finding) | .finding.osv' vuln.json | sort -u)
          if [ -n "$findings" ]; then
            echo "govulncheck findings:"
            echo "$findings"
          fi
          unexpected=$(echo "$findings" | grep -vxE 'GO-2026-4887|GO-2026-4883' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected vulnerabilities (not in allowlist): $unexpected"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: adinhodovic/compass

      - name: Test Docker build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}

  release_image:
    name: Release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release'
    permissions:
      contents: read
    needs:
      - test
      - zizmor
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: adinhodovic/compass
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release_artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release'
    permissions:
      contents: write
    needs:
      - test
      - zizmor
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Build release binaries
        run: make build-all

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            compass-linux-amd64 \
            compass-linux-arm64 \
            --clobber
