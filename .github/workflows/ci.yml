name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!deploy/**"
      - "!docs/**"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!deploy/**"
      - "!docs/**"
      - "!**/*.md"
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          inputs: .github/workflows
          version: v1.24.1

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # internal/server/static/ is gitignored and regenerated by
      # `make build`; the //go:embed in server.go fails typecheck
      # otherwise, so populate it before lint.
      - name: Build assets
        run: make assets

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Build binary
        run: make build

      - name: Run unit tests
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.0
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.x --bin-dir /tmp/envtest -p path)"
          go test ./... -v

      - name: Install Playwright browser
        # GitHub-hosted Ubuntu images already provide Chromium's system
        # dependencies. Avoid --with-deps here: its apt phase can hang while
        # the browser cache is already available.
        run: npx playwright install chromium

      - name: Run e2e tests
        run: make test-e2e

      - name: Run govulncheck
        # JSON mode exits 0 regardless; the jq step is the actual gate.
        # Moby IDs are allowlisted when they are server-side vulns
        # (AuthZ plugin bypass, plugin-privilege off-by-one) that
        # Compass never reaches — we use the docker client only to
        # list containers. No upstream fix is published yet.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          govulncheck -format json ./... > vuln.json
          findings=$(jq -r 'select(.finding and any(.finding.trace[]?; .package?)) | .finding.osv' vuln.json | sort -u)
          if [ -n "$findings" ]; then
            echo "govulncheck findings:"
            echo "$findings"
          fi
          unexpected=$(echo "$findings" | grep -vxE 'GO-2026-4887|GO-2026-4883' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected vulnerabilities (not in allowlist): $unexpected"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: adinhodovic/compass

      - name: Test Docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}

  release_image:
    name: Release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release'
    permissions:
      contents: read
    needs:
      - test
      - zizmor
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: adinhodovic/compass
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release_artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release'
    permissions:
      contents: write
    needs:
      - test
      - zizmor
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build release binaries
        run: make build-all

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            compass-linux-amd64 \
            compass-linux-arm64 \
            --clobber
