name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!deploy/**"
      - "!docs/**"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!deploy/**"
      - "!docs/**"
      - "!**/*.md"
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # internal/server/static/ is gitignored and regenerated by
      # `make build`; the //go:embed in server.go fails typecheck
      # otherwise, so populate it before lint.
      - name: Build assets
        run: make assets

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build binary
        run: make build

      - name: Run unit tests
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.0
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.x --bin-dir /tmp/envtest -p path)"
          go test ./... -v

      - name: Run e2e tests
        run: |
          npx playwright install --with-deps chromium
          make test-e2e

      - name: Run govulncheck
        # JSON mode exits 0 regardless; the jq step is the actual gate.
        # Two Moby IDs are allowlisted: both are server-side vulns
        # (AuthZ plugin bypass, plugin-privilege off-by-one) that
        # Compass never reaches — we use the docker client only to
        # list containers. No upstream fix is published yet.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          govulncheck -format json ./... > vuln.json
          findings=$(jq -r 'select(.finding) | .finding.osv' vuln.json | sort -u)
          if [ -n "$findings" ]; then
            echo "govulncheck findings:"
            echo "$findings"
          fi
          unexpected=$(echo "$findings" | grep -vxE 'GO-2026-4887|GO-2026-4883' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected vulnerabilities (not in allowlist): $unexpected"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: adinhodovic/compass

      - name: Test Docker build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release'
    permissions:
      contents: write
    needs:
      - test
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: adinhodovic/compass
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build release binaries
        run: make build-all

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            compass-linux-amd64
            compass-linux-arm64
