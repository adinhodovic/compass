---
name: Release Chart

# Triggers only on Chart.yaml edits. ct-lint requires a version bump on any
# chart change, so every run here is a real release.
on:
  push:
    branches:
      - main
    paths:
      - "deploy/charts/compass/Chart.yaml"

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Package and push to GHCR (OCI)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "$GITHUB_TOKEN" \
            | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/charts/compass
          helm push compass-*.tgz "oci://ghcr.io/$REPOSITORY_OWNER/charts"
