---
name: Release Chart

# Triggers only on Chart.yaml edits. ct-lint requires a version bump on any
# chart change, so every run here is a real release.
on:
  push:
    branches:
      - main
    paths:
      - "deploy/charts/compass/Chart.yaml"

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5

      - name: Package and push to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/charts/compass
          helm push compass-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
